# nginx in front of Legion, on one domain:
#
#   https://legion.example.com/        -> dashboard (Next.js, 127.0.0.1:3000)
#   https://legion.example.com/api/... -> API (127.0.0.1:8000, "/api" stripped),
#                                         including the live-alert WebSocket
#                                         (/api/ws/alerts) and the Wazuh
#                                         webhook (/api/security-events/webhook)
#
# Install (Ubuntu/Debian — full walkthrough in DEPLOY-ONLINE.md):
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/legion
#   sudo sed -i 's/legion.example.com/YOUR-DOMAIN/' /etc/nginx/sites-available/legion
#   sudo ln -s /etc/nginx/sites-available/legion /etc/nginx/sites-enabled/legion
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-DOMAIN        # adds HTTPS and the http→https redirect
#
# Legion itself listens on 127.0.0.1 only; nginx is the one thing on the
# public interface.
#
# Behind Cloudflare (or any CDN / load balancer), $remote_addr is the proxy and
# every visitor would share ONE rate-limit bucket: the sign-in limit would lock
# everyone out at once. Restore the real client address first, trusting the
# CDN's published ranges only — never a header from an arbitrary peer:
#   sudo ops/update-cloudflare-ips.sh --reload     # writes /etc/nginx/legion-cloudflare.conf
#   then uncomment the `include` line in the server block below, reload nginx.
# Legion itself needs no change: it trusts THIS nginx (loopback) and reads the
# client address from the X-Forwarded-For that nginx sets from the real IP.
# Full walkthrough, origin lockdown and Cloudflare dashboard rules: DEPLOY-ONLINE.md §12.
#
# Build the dashboard with NEXT_PUBLIC_API_URL=https://YOUR-DOMAIN/api
# (`npm run setup -- --domain YOUR-DOMAIN` writes that for you, together with
# REFRESH_COOKIE_PATH=/api/auth: the browser sees the refresh endpoint under
# /api, and its cookie is scoped to that path).
#
# Headers: the API sets its own CSP/HSTS/frame headers, and the dashboard
# (Next.js) sets its own CSP — so nginx adds only the basics below and does
# NOT add a second Content-Security-Policy, which would intersect with theirs.
# Do not set Access-Control-* here: CORS is decided by the API (CORS_ORIGINS).

# Request-rate limits in front of the API (per client address). Legion also
# limits itself; these stop floods before they cost a Node.js request.
#   legion_auth     sign-in, reset, invitation endpoints: generous for people
#   legion_api      everything else under /api/ except the sensor webhook
# The sensor webhook has its own limiter inside Legion that counts only FAILED
# authentications, so a busy Wazuh manager is never throttled here.
limit_req_zone $binary_remote_addr zone=legion_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=legion_api:10m  rate=20r/s;
#   legion_mail     endpoints that make Legion SEND an email (sign-up, password
#                   reset, resend): the costliest unauthenticated requests
#   legion_web      the dashboard's pages and assets
limit_req_zone $binary_remote_addr zone=legion_mail:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=legion_web:10m  rate=50r/s;
limit_req_status 429;
# Simultaneous connections per client address (see `limit_conn` below).
limit_conn_zone $binary_remote_addr zone=legion_conn:10m;
limit_conn_status 429;

# WebSocket upgrade only when the browser asks for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream legion_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream legion_dashboard {
    # "localhost", not 127.0.0.1: `next start -H localhost` may bind to ::1.
    server localhost:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name legion.example.com;

    # Legion refuses larger bodies itself (256 KB API, 1 MB sensor webhook).
    client_max_body_size 2m;
    server_tokens off;
    # Slow-loris: a client must send its headers and body promptly.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    # Free the memory of connections that timed out instead of lingering in FIN_WAIT.
    reset_timedout_connection on;
    # Small header buffers: oversized or many headers are refused early (400/414).
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    # Open connections per client address, all locations. Generous: an office
    # or a mobile carrier can put hundreds of people behind one address.
    limit_conn legion_conn 300;
    # Fail fast if the API is down rather than holding the client's connection.
    proxy_connect_timeout 5s;

    # Behind Cloudflare: see the header of this file. Uncomment AFTER running
    # ops/update-cloudflare-ips.sh (nginx refuses to start if the file is missing).
    # include /etc/nginx/legion-cloudflare.conf;

    # HSTS: harmless on port 80 (browsers ignore it over plain HTTP) and in
    # force as soon as certbot adds HTTPS to this server block. The API sends
    # its own too; "always" covers error pages. Add "preload" only deliberately.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Endpoints that send an email on request. A regex location wins over the
    # prefix one below, so "rewrite … break" does the "/api" stripping here.
    location ~ ^/api/auth/(register|forgot-password|resend-verification)$ {
        limit_req zone=legion_mail burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://legion_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=legion_auth burst=20 nodelay;
        proxy_pass http://legion_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/security-events/webhook {
        # No request-rate limit here: sensor volume is legitimate and bursty.
        # Legion throttles failed authentications itself (webhook-guard.ts).
        proxy_pass http://legion_api/security-events/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=legion_api burst=200 nodelay;
        # The trailing slash strips "/api": /api/auth/login -> /auth/login.
        proxy_pass http://legion_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, don't append: a client-supplied header must not survive.
        # The API trusts this proxy by ADDRESS (TRUSTED_PROXIES, default
        # loopback = this machine) and takes the client IP from here for rate
        # limits, the audit log and the WebSocket handshake.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live-alert sockets stay open; don't cut them after 60 s of quiet.
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=legion_web burst=200 nodelay;
        proxy_pass http://legion_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
