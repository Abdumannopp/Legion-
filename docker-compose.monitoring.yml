# Monitoring for the Legion pilot: Prometheus + Alertmanager + Grafana, all
# bound to 127.0.0.1 (reach them through an SSH tunnel; never publish them).
# Replaces an earlier version that mounted a file that did not exist.
#
#   mkdir -p monitoring/secrets && chmod 700 monitoring/secrets
#   printf '%s' "$HEALTH_METRICS_TOKEN"     > monitoring/secrets/metrics-token      # same value as .env.pilot
#   printf '%s' "https://hooks.example/..." > monitoring/secrets/alert-webhook-url  # the team's channel
#   chmod 600 monitoring/secrets/*
#   GRAFANA_ADMIN_PASSWORD=... docker compose -f docker-compose.monitoring.yml up -d
#
# Prometheus reaches the API on the host's loopback (host.docker.internal).
name: legion-monitoring

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  pids_limit: 200
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle=false
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/secrets/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    user: "65534:65534"
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets/alert-webhook-url:/etc/alertmanager/secrets/alert-webhook-url:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_DATA: /var/lib/grafana-data
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana-data
    tmpfs: [/tmp]
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 384m

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
