services:
  - type: web
    name: veyra-logistics
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run prod
    healthCheckPath: /api/health
    disk:
      name: veyra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/veyra.db
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_NAME
        value: VEYRA Administrator
      - key: INITIAL_ADMIN_EMAIL
        value: admin@your-domain.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: WEIGHT_UNIT
        value: kg
      - key: CURRENCY
        value: USD
      - key: MAX_RATE
        value: "10000000"
      - key: MESSAGE_LANGUAGE
        value: uz
      # Encrypts each company's saved Twilio token. Keep it; if it changes, Twilio settings are entered again.
      - key: SECRETS_KEY
        generateValue: true
      # Optional keys: Render asks for them when the Blueprint is created; leave empty to keep a feature off.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MESSAGING_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
