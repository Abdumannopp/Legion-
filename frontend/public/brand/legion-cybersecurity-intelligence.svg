<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LEGION — Cybersecurity Intelligence</title>
  <desc id="desc">Purple Spartan helmet inside a shield, with the LEGION wordmark and CYBERSECURITY INTELLIGENCE tagline.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5B8FF"/>
      <stop offset=".42" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCC4FF"/>
      <stop offset=".48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(42 28)">
    <path d="M170 8 L316 67 L307 207 Q296 278 170 350 Q44 278 33 207 L24 67 Z"
          fill="none" stroke="url(#violet)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M170 40 Q116 74 91 123 L91 211 L137 280 L170 315 L203 280 L249 211 L249 123 Q224 74 170 40Z"
          fill="#10071D" stroke="url(#helmet)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M170 43 L170 188 L104 151 L111 204 L146 228 L146 285 L170 315Z"
          fill="url(#helmet)" opacity=".96"/>
    <path d="M170 43 L170 188 L236 151 L229 204 L194 228 L194 285 L170 315Z"
          fill="#4C1D95" opacity=".88"/>
    <path d="M170 43 L170 188 L104 151 L111 204 L146 228 L146 285"
          fill="none" stroke="#E9D5FF" stroke-opacity=".72" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 43 L170 188 L236 151 L229 204 L194 228 L194 285"
          fill="none" stroke="#A855F7" stroke-opacity=".9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M104 151 L151 174 L170 191 L189 174 L236 151 L229 188 L190 211 L170 213 L150 211 L111 188Z"
          fill="#090510"/>
    <path d="M118 169 L157 185 L145 190 L126 183Z M222 169 L183 185 L195 190 L214 183Z"
          fill="#F5E9FF" filter="url(#glow)"/>
    <path d="M170 214 L170 315" stroke="#D8B4FE" stroke-width="3" opacity=".7"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(420 0)">
    <text x="0" y="218" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
          font-size="112" font-weight="800" letter-spacing="12">LEGION</text>
    <rect x="4" y="250" width="650" height="2" fill="url(#violet)" opacity=".9"/>
    <text x="4" y="294" fill="#D8D2E2" font-family="Arial, Helvetica, sans-serif"
          font-size="25" font-weight="500" letter-spacing="5.2">CYBERSECURITY INTELLIGENCE</text>
  </g>
</svg>